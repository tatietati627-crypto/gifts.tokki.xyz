name: Download And Commit All Gifts

on:
  workflow_dispatch:

jobs:
  run-download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Downloader
        run: node downloader.js

      - name: Commit and Push all files to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/
          git commit -m "Auto-download: full dataset (PNG, Lottie, TGS, SVG, Backdrops, Patterns)" || echo "No changes"
          git push
